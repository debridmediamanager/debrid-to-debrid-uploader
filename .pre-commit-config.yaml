default_install_hook_types:
  - pre-commit
default_stages:
  - pre-commit
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10000"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: biome-check
        name: Biome format, lint, and imports
        entry: bun run check:biome
        language: system
        pass_filenames: false
        always_run: true

      - id: typecheck
        name: TypeScript typecheck
        entry: bun run typecheck
        language: system
        pass_filenames: false
        always_run: true

      - id: test
        name: Bun tests
        entry: bun run test
        language: system
        pass_filenames: false
        always_run: true
